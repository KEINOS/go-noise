# It runs unit tests on various versions of Go.
name: go1.22+
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Runs at 19:10 UTC on day-of-month 1 (Every day-of-month 1 at AM 04:10 JST, my time)
    # See: https://crontab.guru/
    - cron: '10 19 1 * *'
env:
  PATH_CACHE: /tmp/docker-img-arch
jobs:
  go:
    name: Run tests on Go via container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Create hash for image tagging
        id: imagehash
        uses: KEINOS/gh-action-hash-for-cache@v1.3.0
        with:
          path: |
            ./.github/Dockerfile
            ./.github/docker-compose.yml
            ./go.mod
          variant: $(TZ=UTC-9 date '+%Y%m')
      - name: Export cache paths and tags
        id: imagetag
        run: |
          echo "PATH_TAR=${PATH_CACHE}/tar" >> "$GITHUB_OUTPUT"
      - name: Enable cache/restore image archive
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.PATH_CACHE }}
          key: ${{ steps.imagehash.outputs.hash }}
      - name: Load Docker images if exist
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          docker load --input ${{ steps.imagetag.outputs.PATH_TAR }}/go1.22.tar
          docker load --input ${{ steps.imagetag.outputs.PATH_TAR }}/latest.tar
      - name: Pull base images if no-exist
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          : # Pull images one-by-one for stability
          docker pull golang:1.22-alpine
          docker pull golang:alpine
      - name: Build Docker images if no-exists
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ steps.imagetag.outputs.PATH_TAR }}
          : # Build container images
          docker compose --file .github/docker-compose.yml build v1_22 latest
      - name: Save built images if no-exists
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker save --output ${{ steps.imagetag.outputs.PATH_TAR }}/go1.22.tar go-noise-test:go1.22
          docker save --output ${{ steps.imagetag.outputs.PATH_TAR }}/latest.tar go-noise-test:latest
      - name: Run tests on Go 1.22
        run: docker compose --file .github/docker-compose.yml run --rm -T v1_22
      - name: Run tests on latest Go
        run: docker compose --file .github/docker-compose.yml run --rm -T latest
