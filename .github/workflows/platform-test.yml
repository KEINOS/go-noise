# This workflow runs the unit test (`go test ./...`) on various platforms,
# such as: Linux, macOS and Windows.
name: Platform Tests
on:
  workflow_dispatch:
  pull_request:
env:
  GOTOOLCHAIN: local
jobs:
  coverage:
    name: Unit test
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.22.x'
      - name: Run unit test
        if: runner.os != 'macOS'
        run: go test -mod=readonly -v ./... ./_example/3d
      - name: Run unit test on macOS
        if: runner.os == 'macOS'
        # Go 1.22 needs the system linker to add LC_UUID on macOS 26.
        env:
          CGO_ENABLED: '1'
        run: go test -mod=readonly -v -ldflags=-linkmode=external ./... ./_example/3d
      - name: Build the 3D example
        shell: bash
        run: go build -mod=readonly -o "$RUNNER_TEMP/go-noise-3d" ./_example/3d
