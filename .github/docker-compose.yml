# Test with Go 1.22 and the latest stable release.
# Run tidy before the test services when updating dependencies.
services:
  tidy:
    build:
      context: ..
      dockerfile: .github/Dockerfile
    volumes:
      - ..:/workspaces
    entrypoint: ["./.github/go-mod-tidy.sh"]
  v1_22:
    image: go-noise-test:go1.22
    build:
      context: ..
      dockerfile: .github/Dockerfile
    volumes:
      - ..:/workspaces
  latest:
    image: go-noise-test:latest
    build:
      context: ..
      dockerfile: .github/Dockerfile
      args:
        VARIANT: alpine
    volumes:
      - ..:/workspaces
